<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Visual Portfolio</title>
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --card-bg: #141418;
            --accent: #e91e63;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; }
        
        /* Header */
        header { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 5%; border-bottom: 1px solid #222; }
        .logo { font-weight: 800; font-size: 1.25rem; letter-spacing: 1px; color: var(--text-main); text-decoration: none; }
        .nav-links a { color: var(--text-muted); text-decoration: none; margin-left: 1.5rem; font-size: 0.95rem; transition: color 0.2s; }
        .nav-links a:hover { color: var(--text-main); }

        /* Container & Filters */
        .container { max-width: 1100px; margin: 0 auto; padding: 3rem 5%; }
        .page-title { text-align: center; margin-bottom: 2rem; }
        .filter-bar { display: flex; justify-content: center; gap: 0.75rem; margin-bottom: 2.5rem; flex-wrap: wrap; }
        .filter-btn {
            background: var(--card-bg); color: var(--text-main); border: 1px solid #2a2a30;
            padding: 0.6rem 1.25rem; border-radius: 999px; cursor: pointer; font-size: 0.9rem; transition: 0.2s;
        }
        .filter-btn.active, .filter-btn:hover { background: var(--accent); border-color: var(--accent); }

        /* Media Grid */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .media-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid #222; }
        .media-card img, .media-card video { width: 100%; height: 320px; object-fit: cover; display: block; }
        .media-info { padding: 1rem; }
        .media-info h3 { font-size: 1rem; margin-bottom: 0.25rem; }
        .media-info span { font-size: 0.8rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">STUDIO.</a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="contact.html">Get in Touch</a>
        </nav>
    </header>

    <main class="container">
        <div class="page-title">
            <h1>Featured Work</h1>
            <p style="color: var(--text-muted);">Explore curated photography and short-form video reels.</p>
        </div>

        <div class="filter-bar">
            <button class="filter-btn active" onclick="filterMedia('all')">All Media</button>
            <button class="filter-btn" onclick="filterMedia('photos')">Photos</button>
            <button class="filter-btn" onclick="filterMedia('videos')">Videos</button>
        </div>

        <div class="gallery-grid" id="galleryGrid"></div>
    </main>

    <script>
        // ==========================================
        // ADD NEW UPLOADS HERE
        // ==========================================
        const portfolioItems = [
            { type: 'photos', title: 'Urban Lifestyle Portrait', src: 'assets/photo1.jpg' },
            { type: 'videos', title: 'Brand Promo Reel', src: 'assets/reel1.mp4' },
            { type: 'photos', title: 'Golden Hour Session', src: 'assets/photo2.jpg' },
            // Copy and paste a line above whenever you upload a new file to your assets folder
        ];

        const grid = document.getElementById('galleryGrid');
        const buttons = document.querySelectorAll('.filter-btn');

        function renderGallery(filter) {
            grid.innerHTML = '';
            const filtered = filter === 'all' 
                ? portfolioItems 
                : portfolioItems.filter(item => item.type === filter);

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'media-card';
                
                const mediaElement = item.type === 'videos'
                    ? `<video src="${item.src}" controls muted playsinline></video>`
                    : `<img src="${item.src}" alt="${item.title}" loading="lazy">`;

                card.innerHTML = `
                    ${mediaElement}
                    <div class="media-info">
                        <span>${item.type === 'videos' ? 'Short-Form Reel' : 'Photography'}</span>
                        <h3>${item.title}</h3>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterMedia(category) {
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderGallery(category);
        }

        // Check URL parameter on page load (e.g., gallery.html?filter=videos)
        const urlParams = new URLSearchParams(window.location.search);
        const initialFilter = urlParams.get('filter') || 'all';
        
        buttons.forEach(btn => {
            if (btn.textContent.toLowerCase().includes(initialFilter)) {
                buttons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
        });
        renderGallery(initialFilter);
    </script>
</body>
</html>
